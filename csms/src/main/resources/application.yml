server:
  port: 8080
  ssl:
    # wss/TLS 종료는 설정으로 켜고 끈다 (PLAN §11.4). 직접 종료하려면 enabled=true 와 함께
    # key-store / key-store-password / key-store-type 등을 채운다. 리버스 프록시가 앞단에서
    # TLS 를 끝내고 내부로 ws 를 넘기는 구성도 가능하다 — 그때는 여기를 false 로 둔다.
    enabled: false

spring:
  datasource:
    # OUT_TIMED_OUT 장부만 여기 산다 (PLAN §5.3 불변식, §6 기술선택).
    # **파일 기반이어야 한다** — 인메모리면 장부 불균형이 재시작마다 사라지고, 그건
    # "보상해야 할 채무를 기록으로 남긴다"는 요구를 만족하지 못한다.
    url: jdbc:h2:file:./data/swapve;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # schema.sql 한 장. 마이그레이션 도구는 도입하지 않는다 (PLAN §11.0).
      mode: always

csms:
  recovery:
    enabled: true
  retention:
    enabled: true
    # 감사·분쟁에서 원문을 볼 수 있는 기간. 지표도 이 보존 창 안의 원문만 파생 계산한다.
    event-log: 30d
    # 기동 리플레이 비용은 더 짧게 둔다. 복구와 감사는 목적이 달라 한 값으로 묶지 않는다.
    replay-window: 7d
    # 기간 정리 뒤에도 남은 비정상 잔량을 스테이션별 최신 N건으로 자르는 안전망.
    max-events-per-station: 100000
    sweep-interval: 1h
  # 실제 연결 URL 은 여기에 "/" + 스테이션 식별자가 붙는다 (Part 4 §3.1.1).
  # 예: ws://localhost:8080/ocpp/CS001
  endpoint-path: /ocpp
  security:
    # 운영 기본값은 BASIC 이다. 로컬 실험에서만 NONE 으로 낮춘다.
    profile: BASIC
    # 프로파일 1 자격증명. station-id 는 URL 경로 식별자 및 Basic username 과 같아야 한다.
    # 해시 생성 예:
    #   Kotlin: BCryptPasswordEncoder(10).encode("station-password")
    stations:
      # - station-id: CS001
      #   password-hash: "$2a$10$replace-with-bcrypt-hash"
  heartbeat-interval: 300s
  # 값이 항상 하나여도 둔다 (PLAN §11.3 로밍).
  operator-id: swapve
  max-text-message-size: 65536
  call-timeout: 30s
  # MVP 인가 정책 — 이 목록 조회가 전부다. 사용자 테이블이 아니라 (idToken, type) 값 객체의
  # 집합이다 (PLAN §11.3). 목록에 없는 토큰은 거부되지만 시도는 기록된다.
  authorized-id-tokens:
    - id-token: RFID-0001
      type: ISO14443
  # 이 CPO 가 아는 배터리 (PLAN §5.4 F3). 목록에 없는 일련번호가 오면 응답에
  # customData 로 Rejected/BatteryUnknown 을 실어 알린다 (PLAN §4.8).
  # **비어 있으면 배터리를 식별하지 않는다** — 근거는 BatteryRegistry KDoc.
  # 실제 배터리 등록 절차는 아직 없다 — 인가 토큰 목록과 같은 성격의 시드 목록이다.
  known-battery-serials:
    # 공식 적합성 케이스 TC_S_103_CSMS 가 지정한 일련번호 (Part 6 step 11/21)
    - "1234"
    - "5678"
    - "4321"
    - "8765"
    # 로컬 실행·M6 종단 시험이 쓰는 시드 재고
    - BAT-USED-1
    - BAT-USED-2
    - BAT-FULL-3
    - BAT-FULL-4

logging:
  level:
    dev.swapve: INFO
