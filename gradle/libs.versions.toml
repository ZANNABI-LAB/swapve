[versions]
kotlin = "2.1.0"
junit = "5.11.4"
jackson = "2.18.2"
networknt = "1.5.6"
# slf4j 구현이 없다는 경고를 끄기 위한 no-op 바인딩. 우리 코드는 slf4j 를 쓰지 않는다 —
# json-schema-validator 가 전이로 slf4j-api 를 끌고 오는 것이 전부다. 아래 라이브러리 주석 참조.
slf4j = "2.0.16"
coroutines = "1.10.1"
# csms 전용. ocpp-core / swap-domain 은 Spring 을 모른다 (빌드 검사로 강제한다)
spring-boot = "3.4.1"
spring-dependency-management = "1.1.7"
# Maven Central Portal 배포. Sonatype 공식 Gradle 플러그인이 아직 없어 커뮤니티 표준을 쓴다.
# ⚠️ 0.34.0 이 **Kotlin 2.1.x 를 지원하는 마지막 판**이다 (0.35.0 부터 KGP 2.2.0 을 요구한다).
# Kotlin 을 올릴 때 이 버전도 같이 올린다 — 배포하려고 Kotlin 을 올리지는 않는다.
maven-publish = "0.34.0"
# API 문서. javadoc jar 를 채운다 — 좌표로 받은 소비자가 문서를 보는 다른 경로가 없다.
dokka = "2.0.0"
# 콘솔 화면의 빌드 체인. **Node 를 이 플러그인이 직접 내려받는다** — README 가 약속한
# "JDK 17 과 git 뿐"을 지키기 위해서다. Gradle 배포판을 래퍼가 받아오는 것과 같은 방식이다.
node-gradle = "7.1.0"
# 화면 빌드에 쓰는 Node. LTS 에 고정한다 — 산출물이 기계마다 달라지지 않게.
# vite 7 이 요구하는 하한이 22.12 다(`^20.19.0 || >=22.12.0`) — 그 아래로 내리면 빌드가 선다.
nodejs = "22.23.2"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# 공식 스키마는 draft-06 이다
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
# ★ **아무것도 기록하지 않는 로거.** 우리 코드에는 slf4j 호출이 한 줄도 없는데,
# `json-schema-validator` 가 slf4j-api 를 전이로 끌고 온다. 구현이 없으면 첫 로깅 시도에
# `SLF4J(W): No SLF4J providers were found.` 세 줄이 stderr 로 나가고, 배포물을 처음 받은
# 사람은 그것을 우리 결함으로 읽는다. **로그를 켜는 것이 아니라 남의 경고를 끄는 것**이므로
# no-op 을 쓴다 — 이 도구가 실제로 무엇을 했는지는 이벤트 로그가 말한다.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# 세션 계층의 동시성 — pending CALL 대기, 스테이션 단위 락
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# 가상 시간. 타임아웃 테스트가 실제로 기다리지 않게 한다
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# WebSocket 서버. 버전은 spring-dependency-management 가 BOM 으로 정한다
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# BCryptPasswordEncoder 만 쓴다. starter-security 를 넣으면 필터체인 자동설정까지 따라온다.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
# OUT_TIMED_OUT 장부의 영속. JdbcTemplate 하나면 충분해
# JPA 는 넣지 않는다 — 테이블 1개짜리 장부에 ORM 은 순비용이다
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
h2 = { module = "com.h2database:h2" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
# @ConfigurationProperties 의 생성자 바인딩이 Kotlin 주 생성자를 읽으려면 리플렉션이 필요하다
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# @Configuration / @Component 클래스를 open 으로 만든다. Spring 의 CGLIB 프록시가 요구한다
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
