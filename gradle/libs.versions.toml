[versions]
kotlin = "2.1.0"
junit = "5.11.4"
jackson = "2.18.2"
tsid = "5.2.6"
networknt = "1.5.6"
coroutines = "1.10.1"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# 공식 스키마는 draft-06 이다 (PLAN §6 기술선택)
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
# 시간순 정렬 가능한 ID — 로컬 카운터 금지 (PLAN §11.5)
tsid-creator = { module = "com.github.f4b6a3:tsid-creator", version.ref = "tsid" }
# 세션 계층의 동시성 — pending CALL 대기, per-station 락 (PLAN §11.5)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# 가상 시간. 타임아웃 테스트가 실제로 기다리지 않게 한다
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
