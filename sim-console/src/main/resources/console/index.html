<!DOCTYPE html>
<!--
  시뮬레이터 제어 콘솔 — 정적 파일 한 장 (B24).

  외부 CDN·폰트·프레임워크를 링크하지 않는다. 네트워크 없는 곳에서도 떠야 하기 때문이고,
  그 사실은 :sim-console:checkNoForbiddenDependencies 가 이 파일까지 훑어 확인한다.

  화면은 예쁠 필요는 없고 **정확해야** 한다. 받지 않은 값은 — 로 두고, 붙지 않은 스테이션의
  슬롯은 그리지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwapVe — 시뮬레이터 제어 콘솔</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 1.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.5;
  }
  h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .5rem; }
  p.lede { margin: 0 0 1.5rem; opacity: .75; }
  fieldset { border: 1px solid #8886; border-radius: 6px; padding: .75rem 1rem 1rem; }
  legend { padding: 0 .4rem; font-weight: bold; }
  label { display: inline-block; margin: .25rem .75rem .25rem 0; }
  label span { display: block; font-size: .8rem; opacity: .75; }
  input, select, button { font: inherit; padding: .25rem .4rem; }
  input { width: 12rem; }
  input.narrow { width: 4rem; }
  button { cursor: pointer; border-radius: 4px; border: 1px solid #8886; background: #8881; }
  button:hover { background: #8883; }
  .card { border: 1px solid #8886; border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0; }
  .card header { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .card header b { font-size: 1.05rem; }
  .meta { font-size: .85rem; opacity: .75; margin: .35rem 0 .6rem; }
  .badge { border-radius: 999px; padding: .05rem .55rem; font-size: .8rem; border: 1px solid; }
  .badge.sub { border-style: dashed; opacity: .8; }
  .ATTACHED { color: #666; }
  .RUNNING, .AWAITING_REMOTE_START { color: #b26a00; }
  .COMPLETED { color: #1a7f37; }
  .REJECTED, .FAILED { color: #b3261e; }
  table { border-collapse: collapse; width: 100%; max-width: 46rem; margin: .25rem 0 .75rem; }
  th, td { text-align: left; padding: .2rem .5rem; border-bottom: 1px solid #8883; }
  th { font-size: .8rem; opacity: .75; font-weight: normal; }
  td.empty { opacity: .45; }
  td .suspended { opacity: .75; }
  .actions { display: flex; gap: .35rem; flex-wrap: wrap; }
  /* 각본(.actions)과 한 걸음(.ops)은 손이 닿는 결과가 다르다 — 눈으로도 갈라 둔다. */
  .ops { margin: .75rem 0 0; border-style: dashed; padding: .4rem .75rem .6rem; }
  .ops legend { font-weight: normal; font-size: .85rem; opacity: .8; }
  .ops .row { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin: .25rem 0; }
  .ops .row > i { font-style: normal; font-size: .78rem; opacity: .6; min-width: 3.5rem; }
  .ops button { border-style: dashed; background: transparent; }
  .ops button:disabled { cursor: not-allowed; opacity: .4; }
  .ops input, .ops select { padding: .1rem .3rem; }
  .ops .lede { margin: .1rem 0 .4rem; font-size: .8rem; opacity: .75; }
  details { margin: .5rem 0 0; }
  summary { cursor: pointer; font-size: .85rem; opacity: .8; }
  .note, .hint, .error {
    border-left: 3px solid; padding: .35rem .6rem; margin: .4rem 0;
    font-size: .85rem; white-space: pre-wrap; word-break: break-all;
  }
  .note { border-color: #b26a00; }
  .hint { border-color: #0969da; }
  .error { border-color: #b3261e; }
  .faults li { margin: .2rem 0; }
  .faults b { display: inline-block; min-width: 9rem; }
  .none { opacity: .6; }
</style>
</head>
<body>

<h1>SwapVe — 시뮬레이터 제어 콘솔</h1>
<p class="lede">
  스테이션 <b>시뮬레이터</b>를 조종하는 시험계 화면입니다. 관제 서버(CSMS)가 아닙니다 —
  교환 이력·지표는 CSMS 의 REST API 에 있습니다.
</p>

<fieldset>
  <legend>스테이션 붙이기</legend>
  <label>CSMS URL <span>스테이션 식별자 제외</span><input id="csmsUrl"></label>
  <label>stationId <span>스테이션 식별자</span><input id="stationId" value="CS001"></label>
  <label>슬롯 <span>=EVSE 수</span><input id="slots" class="narrow" value="4"></label>
  <label>세트 <span>한 번에 오가는 수</span><input id="setSize" class="narrow" value="2"></label>
  <label>순서 <span>SwapOrder</span>
    <select id="swapOrder"><option>In-Out</option><option>Out-In</option></select>
  </label>
  <label>인가 토큰 <span>IdToken</span><input id="idToken" value="RFID-0001"></label>
  <button id="attach">붙이기</button>
  <div id="attachError"></div>
</fieldset>

<h2>붙어 있는 스테이션</h2>
<div id="stations"></div>

<h2>장애 주입 — PLAN §5.4 실패 시나리오</h2>
<ul class="faults" id="faults"></ul>

<script>
"use strict";

var state = { defaultCsmsUrl: "", faults: [], stations: [] };

/**
 * 조작 한 걸음의 목록 — StationOp.wireValue 13 가지를 그대로 옮긴 순수 데이터다.
 *
 * group 은 docs/VIRTUAL-STATION.md §1 이 가른 Acts(사실을 바꾸고 알린다) /
 * Reports(말할 뿐 아무것도 바꾸지 않는다) 를 그대로 쓴다. Scripts 는 여기 없다 —
 * 교환 시작 버튼이 이미 그 자리다.
 *
 * needs 는 손으로 재현했을 때 걸리는 장애 시나리오의 id 다. 문구 자체는 여기 적지 않고
 * state.faults 에서 가져온다 — 코드와 화면에 같은 설명이 두 벌 생기지 않게 한다.
 */
var OPS = [
  { op: "connect", label: "connect", group: "Acts",
    effect: "전송을 연다. 핸드셰이크만 오간다" },
  { op: "disconnect", label: "disconnect", group: "Acts",
    effect: "소켓만 닫는다 — 세션·슬롯·requestId 는 살아 있다" },
  { op: "reconnect", label: "reconnect", group: "Acts",
    effect: "같은 세션·슬롯 위에 전송만 다시 연다" },
  { op: "boot", label: "boot", group: "Acts",
    effect: "BootNotification → 슬롯마다 NotifyEvent → SecurityEventNotification → 배터리가 있는 슬롯마다 TransactionEvent(Started)" },
  { op: "reboot", label: "reboot", group: "Acts",
    effect: "끊었다 붙고 새 트랜잭션 번호로 다시 연다 (S04.FR.11). 배터리는 그대로 있다" },
  { op: "insertBatteries", label: "insertBatteries", group: "Acts", needs: "F5",
    effect: "투입 슬롯이 배터리를 받고 BatterySwap(BatteryIn) 한 건이 나간다" },
  { op: "removeBatteries", label: "removeBatteries", group: "Acts",
    effect: "반출 슬롯이 배터리를 내주고 BatterySwap(BatteryOut) 한 건이 나간다" },
  { op: "advanceCharging", label: "advanceCharging", group: "Acts", args: "charging",
    effect: "SoC 를 올리고 TransactionEvent(Updated) 를 보낸다. 상한에 닿으면 트랜잭션은 열린 채 급전만 멈춘다" },

  { op: "authorize", label: "authorize", group: "Reports",
    effect: "Authorize 를 보낸다. 슬롯은 하나도 움직이지 않는다" },
  { op: "reportChargingStarted", label: "reportChargingStarted", group: "Reports",
    effect: "투입된 슬롯마다 TransactionEvent(Updated, Charging). 안의 사실은 그대로다" },
  { op: "reportBatteryOutTimeout", label: "reportBatteryOutTimeout", group: "Reports", needs: "F2",
    effect: "미회수 배터리를 실은 BatterySwap(BatteryOutTimeout). 배터리는 슬롯에 그대로 남는다" },
  { op: "resendLastBatterySwap", label: "resendLastBatterySwap", group: "Reports",
    effect: "마지막으로 보낸 BatterySwap 프레임을 다시 보낸다",
    variants: [
      { label: "같은 messageId (F6)", params: { sameMessageId: true }, needs: "F6" },
      { label: "새 messageId (F4)", params: { sameMessageId: false }, needs: "F4" }
    ] }
];

/**
 * 입력 위젯의 값과 마지막 조작의 오류. **프로토콜 상태가 아니다** —
 * 스테이션이 무엇을 하고 있는지는 오직 /api/state 의 스냅샷이 말한다.
 *
 * 1초마다 카드를 다시 그리므로, 여기 담아 두지 않으면 슬롯 선택과 타이핑 중인 숫자가
 * 매초 지워진다. 콘솔이 "인가됨" 같은 순서 상태를 기억하는 것과는 다른 일이다.
 */
var opForm = {};
var opError = {};
var eventsOpen = {};

function el(tag, text, cls) {
  var node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

/** 모르는 값은 모른다고 적는다. 그럴듯한 기본값으로 채우지 않는다. */
function orDash(value) {
  return (value === null || value === undefined || value === "") ? "—" : String(value);
}

function percent(value) {
  return (value === null || value === undefined) ? "—" : value.toFixed(1) + "%";
}

function request(method, path, body) {
  return fetch(path, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (json) {
      if (!response.ok) throw new Error((json.error || "요청이 실패했습니다") + " (" + response.status + ")");
      return json;
    });
  });
}

/** CSMS 의 REST 주소는 WebSocket URL 과 같은 호스트다. F1 을 걸 때 안내에 쓴다. */
function csmsHost(wsUrl) {
  return String(wsUrl).replace(/^wss?:\/\//, "").split("/")[0];
}

/** 옛 스냅샷에는 없을 수 있는 배열들. 없으면 빈 목록이지 오류가 아니다. */
function slotsOf(station) { return station.slots || []; }
function eventsOf(station) { return station.events || []; }

/** F1~F6 의 문구는 서버가 내주는 것 하나뿐이다. 화면이 따로 적어 두지 않는다. */
function faultText(id) {
  var found = null;
  state.faults.forEach(function (fault) { if (fault.id === id) found = fault; });
  return found ? found.expectation : "";
}

function slotTable(station) {
  var slots = slotsOf(station);
  if (!slots.length) return el("p", "슬롯 정보 없음", "none");

  var table = el("table");
  var head = el("tr");
  ["슬롯", "역할", "배터리", "SoC", "SoH", "충전 트랜잭션"].forEach(function (title) {
    head.appendChild(el("th", title));
  });
  table.appendChild(head);

  slots.forEach(function (slot) {
    var row = el("tr");
    row.appendChild(el("td", slot.slotId));
    row.appendChild(el("td", slot.role === "INSERT" ? "투입" : slot.role === "DISPENSE" ? "반출" : "—"));
    if (slot.battery) {
      row.appendChild(el("td", slot.battery.serialNumber));
      row.appendChild(el("td", percent(slot.battery.soC)));
      row.appendChild(el("td", percent(slot.battery.soH)));
    } else {
      row.appendChild(el("td", "비어 있음", "empty"));
      row.appendChild(el("td", "—", "empty"));
      row.appendChild(el("td", "—", "empty"));
    }
    // 급전 멈춤은 트랜잭션 칸 **안**에 적는다. 멈춘 것은 트랜잭션이 아니라 에너지 흐름이고,
    // 두 값을 나란히 두어야 "트랜잭션은 살아 있는데 급전만 멈췄다"가 한 눈에 읽힌다.
    var transaction = el("td", orDash(slot.chargingTransactionId));
    if (slot.chargingSuspended) transaction.appendChild(el("span", "  ·  급전 멈춤(상한 도달)", "suspended"));
    row.appendChild(transaction);
    table.appendChild(row);
  });
  return table;
}

/**
 * 지금 이 버튼을 누를 수 없는 이유. 누를 수 있으면 null 이다.
 *
 * 판정에 쓰는 것은 **그 순간의 스냅샷과 그 카드의 폼 값**뿐이다. 화면은 "인가됨" 같은
 * 순서 상태를 절대 기억하지 않는다 — 그런 게이트를 콘솔이 새로 만들면 authorize 없는
 * insertBatteries(=F5)를 영영 걸 수 없게 되고, 그건 docs/VIRTUAL-STATION.md §3 이
 * 일부러 열어 둔 문이다. 여기서 막는 것은 순서가 아니라 **서버가 확실히 거절할 사실**뿐이다.
 */
function disabledReason(station, op, form) {
  if (station.progress === "RUNNING" || station.progress === "AWAITING_REMOTE_START") {
    return "각본이 도는 중이라 서버가 409 로 거절한다";
  }
  if (op === "connect" || op === "reconnect") {
    return station.connected ? "이미 붙어 있다" : null;
  }
  // 상대가 먼저 닫으면 소켓은 죽었는데 전송 객체는 남는다. 그때 connected 는 거짓이지만
  // connect/reconnect 는 서버에서 "이미 연결돼 있다"로 막히므로, disconnect 를 함께 막으면
  // 화면에서 되살릴 길이 없어진다. 붙어 있지 않을 때 눌러도 하는 일이 없을 뿐이다.
  if (op === "disconnect") return null;
  if (!station.connected) return "붙어 있지 않다 — 먼저 connect 를 걸어야 한다";

  if (op === "insertBatteries") {
    var empty = slotsOf(station).filter(function (slot) {
      return slot.role === "INSERT" && !slot.battery;
    });
    return empty.length ? null : "투입 슬롯이 모두 차 있다 — 넣을 자리가 없다";
  }
  if (op === "removeBatteries") {
    var loaded = slotsOf(station).filter(function (slot) {
      return slot.role === "DISPENSE" && slot.battery;
    });
    return loaded.length ? null : "반출 슬롯에 내줄 배터리가 없다";
  }
  if (op === "advanceCharging") {
    var slot = selectedSlot(station, form);
    if (!slot) return "충전할 슬롯을 고르지 않았다";
    return slot.battery ? null : "슬롯 " + slot.slotId + " 은 비어 있다 — 빈 슬롯은 충전되지 않는다";
  }
  return null;
}

/** 그 카드의 입력 위젯 값. 없으면 만들어 두고, 슬롯은 첫 번째를 골라 둔다. */
function formOf(station) {
  var form = opForm[station.stationId];
  if (!form) {
    form = { slotId: "", byPercent: "" };
    opForm[station.stationId] = form;
  }
  var slots = slotsOf(station);
  if (form.slotId === "" && slots.length) form.slotId = String(slots[0].slotId);
  return form;
}

function selectedSlot(station, form) {
  var found = null;
  slotsOf(station).forEach(function (slot) {
    if (String(slot.slotId) === String(form.slotId)) found = slot;
  });
  return found;
}

function operate(stationId, op, params) {
  var body = { op: op };
  if (params) {
    Object.keys(params).forEach(function (name) { body[name] = params[name]; });
  }
  opError[stationId] = null;
  request("POST", "/api/stations/" + encodeURIComponent(stationId) + "/op", body)
    .then(function () { refresh(); })
    .catch(function (failure) {
      // 조작의 실패는 그 카드에 남긴다. 서버가 무엇을 왜 거절했는지가 문장 그대로 보여야 한다.
      opError[stationId] = failure.message;
      render();
    });
}

function opButton(station, spec, variant) {
  var form = formOf(station);
  var params = variant ? variant.params : null;
  var needs = (variant && variant.needs) || spec.needs;

  var button = el("button", variant ? variant.label : spec.label);
  var reason = disabledReason(station, spec.op, form);
  var title = spec.effect;
  if (needs) title += "\n손으로 거는 " + needs + ": " + faultText(needs);
  button.title = reason ? "누를 수 없다 — " + reason + "\n\n" + title : title;
  button.disabled = !!reason;

  button.onclick = function () {
    if (spec.args === "charging") {
      var charging = { slotId: Number(form.slotId) };
      // byPercent 를 화면에서 검사하지 않는다. 비운 채 누르면 서버의 400
      // ("advanceCharging 에는 byPercent 이 필요하다")이 그대로 보여야 한다.
      if (String(form.byPercent).trim() !== "") charging.byPercent = Number(form.byPercent);
      operate(station.stationId, spec.op, charging);
      return;
    }
    operate(station.stationId, spec.op, params);
  };
  return button;
}

function chargingArgs(station, form) {
  var fragment = document.createDocumentFragment();

  var select = el("select");
  select.id = "op-slot-" + station.stationId;
  slotsOf(station).forEach(function (slot) {
    var option = el("option", "슬롯 " + slot.slotId);
    option.value = String(slot.slotId);
    if (String(slot.slotId) === String(form.slotId)) option.selected = true;
    select.appendChild(option);
  });
  select.onchange = function () { form.slotId = select.value; render(); };
  fragment.appendChild(select);

  var byPercent = el("input", null, "narrow");
  byPercent.id = "op-pct-" + station.stationId;
  byPercent.value = form.byPercent;
  byPercent.placeholder = "byPercent";
  byPercent.oninput = function () { form.byPercent = byPercent.value; };
  fragment.appendChild(byPercent);

  return fragment;
}

function opRow(station, group) {
  var form = formOf(station);
  var row = el("div", null, "row");
  row.appendChild(el("i", group));

  OPS.forEach(function (spec) {
    if (spec.group !== group) return;
    if (spec.args === "charging") row.appendChild(chargingArgs(station, form));
    if (spec.variants) {
      spec.variants.forEach(function (variant) { row.appendChild(opButton(station, spec, variant)); });
    } else {
      row.appendChild(opButton(station, spec, null));
    }
  });
  return row;
}

function opPanel(station) {
  var panel = el("fieldset", null, "ops");
  panel.appendChild(el("legend", "한 걸음씩 조종하기 — 각본이 아니라 조작 한 건"));
  panel.appendChild(el("div",
    "순서를 검사하지 않습니다. authorize 없이 insertBatteries 를 누르는 것이 곧 F5 입니다 — " +
    faultText("F5"),
    "lede"));

  panel.appendChild(opRow(station, "Acts"));
  panel.appendChild(opRow(station, "Reports"));
  if (opError[station.stationId]) panel.appendChild(el("div", opError[station.stationId], "error"));
  return panel;
}

/**
 * 오간 프레임의 꼬리. **본문 칸은 없다** — 스냅샷이 프레임 내용을 싣지 않기 때문이고,
 * 내용을 봐야 한다면 그건 CSMS 의 이벤트 로그 API 가 할 일이다.
 */
function eventTable(station) {
  var events = eventsOf(station);
  var box = el("details");
  box.open = !!eventsOpen[station.stationId];
  box.ontoggle = function () { eventsOpen[station.stationId] = box.open; };
  box.appendChild(el("summary", "오간 프레임 " + events.length + " 건 (최신이 위)"));

  if (!events.length) {
    box.appendChild(el("p", "아직 오간 프레임이 없습니다.", "none"));
    return box;
  }

  var table = el("table");
  var head = el("tr");
  ["seq", "방향", "action", "시각"].forEach(function (title) { head.appendChild(el("th", title)); });
  table.appendChild(head);

  // 스냅샷이 이미 최신을 앞에 두고 내려온다. 화면에서 다시 정렬하지 않는다.
  events.forEach(function (event) {
    var row = el("tr");
    row.appendChild(el("td", orDash(event.seq)));
    row.appendChild(el("td", event.direction === "OUTBOUND" ? "보냄" : event.direction === "INBOUND" ? "받음" : orDash(event.direction)));
    row.appendChild(el("td", orDash(event.action)));
    row.appendChild(el("td", orDash(event.occurredAt)));
    table.appendChild(row);
  });
  box.appendChild(table);
  return box;
}

function stationCard(station) {
  var card = el("div", null, "card");

  var header = el("header");
  header.appendChild(el("b", station.stationId));
  header.appendChild(el("span", station.progress, "badge " + station.progress));
  header.appendChild(el("span", station.connected ? "연결됨" : "끊김", "badge"));
  // 협상 결과는 붙어 있을 때만 있다. 없으면 배지 자체를 그리지 않는다 — 모르는 값이다.
  if (station.subprotocol) header.appendChild(el("span", station.subprotocol, "badge sub"));
  if (station.fault) header.appendChild(el("span", "장애 " + station.fault, "badge"));
  card.appendChild(header);

  card.appendChild(el("div",
    station.connectUrl +
    "  ·  순서 " + station.swapOrder +
    "  ·  토큰 " + station.idToken + "/" + station.idTokenType +
    "  ·  requestId " + orDash(station.requestId) +
    "  ·  오간 메시지 " + station.messageCount + " 건",
    "meta"));

  card.appendChild(slotTable(station));

  if (station.progress === "AWAITING_REMOTE_START") {
    card.appendChild(el("div",
      "CSMS 가 개시해야 하는 시나리오입니다 (S02). 다른 터미널에서:\n" +
      "curl -X POST " + csmsHost(station.csmsUrl) + "/api/swaps -H 'Content-Type: application/json' \\\n" +
      "     -d '{\"stationId\":\"" + station.stationId + "\",\"idToken\":{\"idToken\":\"" +
      station.idToken + "\",\"type\":\"" + station.idTokenType + "\"}}'",
      "hint"));
  }
  // 마지막으로 시도한 전송이 나가지 못했다. **보여 주기만 한다** — 이 값으로 버튼을
  // 비활성으로 만들지 않는다 (disabledReason 은 이것을 읽지 않는다). 비활성은 서버가 확실히
  // 거절할 사실에만 쓰고, 전송 실패는 다시 눌러 볼 수 있는 상황이다. 붙어 있어도 뜰 수
  // 있다는 것이 이 줄의 요점이다 — connected 는 소켓을 답하지 전송의 성패를 답하지 않는다.
  if (station.lastTransmitFailure) {
    card.appendChild(el("div", "마지막 전송이 나가지 못했습니다: " + station.lastTransmitFailure, "error"));
  }
  // CSMS 가 모른다고 답한 action 들. 위 줄과 달리 **쌓인다** — 상대가 그것을 모른다는 사실은
  // 나중에 거짓이 되지 않는다. 여기도 보여 주기만 한다: disabledReason 은 이 목록을 읽지
  // 않는다. 모른다고 했으니 다음부터 보내지 않는 것은 시험계가 시험 대상에 맞춰 조용해지는
  // 일이고, 그러면 그 답이 틀렸을 때 화면에 아무것도 남지 않는다.
  if (station.unsupportedActions && station.unsupportedActions.length) {
    card.appendChild(el("div",
      "CSMS 가 모른다고 답한 action (통보라 넘어갔습니다): " + station.unsupportedActions.join(", "),
      "note"));
  }
  if (station.note) card.appendChild(el("div", station.note, "note"));
  if (station.error) card.appendChild(el("div", station.error, "error"));

  var actions = el("div", null, "actions");
  var swap = el("button", "교환 시작");
  swap.onclick = function () { startSwap(station.stationId, null); };
  actions.appendChild(swap);

  state.faults.forEach(function (fault) {
    var button = el("button", fault.id + " " + fault.title);
    button.title = fault.expectation;
    button.onclick = function () { startSwap(station.stationId, fault.id); };
    actions.appendChild(button);
  });

  var detach = el("button", "내리기");
  detach.onclick = function () {
    request("DELETE", "/api/stations/" + encodeURIComponent(station.stationId)).then(refresh).catch(showError);
  };
  actions.appendChild(detach);
  card.appendChild(actions);

  card.appendChild(opPanel(station));
  card.appendChild(eventTable(station));

  return card;
}

function startSwap(stationId, fault) {
  request("POST", "/api/stations/" + encodeURIComponent(stationId) + "/swap", { fault: fault })
    .then(refresh)
    .catch(showError);
}

function showError(failure) {
  var box = document.getElementById("attachError");
  box.textContent = "";
  box.appendChild(el("div", failure.message, "error"));
}

/**
 * 1초마다 카드를 통째로 다시 그리므로, 타이핑 중이던 칸이 매초 초점을 잃는다.
 * 다시 그리기 전후로 초점과 커서 자리를 그대로 옮겨 둔다.
 */
function focusMark() {
  var active = document.activeElement;
  if (!active || !active.id) return null;
  var mark = { id: active.id, start: null, end: null };
  try {
    mark.start = active.selectionStart;
    mark.end = active.selectionEnd;
  } catch (ignored) {
    // 커서를 갖지 않는 위젯이다 (select 등). 초점만 되돌리면 된다.
  }
  return mark;
}

function focusRestore(mark) {
  if (!mark) return;
  var node = document.getElementById(mark.id);
  if (!node) return;
  node.focus();
  if (mark.start === null || mark.start === undefined) return;
  try {
    node.setSelectionRange(mark.start, mark.end);
  } catch (ignored) {
    // 자리를 못 옮기는 위젯이면 초점까지만 돌려준다.
  }
}

function render() {
  var mark = focusMark();
  var container = document.getElementById("stations");
  container.textContent = "";
  if (!state.stations.length) {
    container.appendChild(el("p", "아직 붙은 스테이션이 없습니다.", "none"));
  } else {
    state.stations.forEach(function (station) {
      // 한 대의 렌더 실패가 화면 전체를 죽이지 않게 한다 — 나머지 스테이션은 계속 보여야 한다.
      try {
        container.appendChild(stationCard(station));
      } catch (failure) {
        container.appendChild(el("div",
          orDash(station && station.stationId) + " 를 그리지 못했습니다: " + failure.message,
          "error"));
      }
    });
  }

  var faults = document.getElementById("faults");
  faults.textContent = "";
  state.faults.forEach(function (fault) {
    var item = el("li");
    item.appendChild(el("b", fault.id + " " + fault.title));
    item.appendChild(el("span", " — " + fault.expectation));
    faults.appendChild(item);
  });
  focusRestore(mark);
}

function refresh() {
  return fetch("/api/state").then(function (response) { return response.json(); }).then(function (json) {
    state = json;
    var csmsUrl = document.getElementById("csmsUrl");
    if (!csmsUrl.value) csmsUrl.value = json.defaultCsmsUrl;
    render();
  });
}

document.getElementById("attach").onclick = function () {
  document.getElementById("attachError").textContent = "";
  request("POST", "/api/stations", {
    csmsUrl: document.getElementById("csmsUrl").value,
    stationId: document.getElementById("stationId").value,
    slots: Number(document.getElementById("slots").value),
    setSize: Number(document.getElementById("setSize").value),
    swapOrder: document.getElementById("swapOrder").value,
    idToken: document.getElementById("idToken").value
  }).then(refresh).catch(showError);
};

refresh();
// 교환이 진행되는 동안 슬롯이 바뀌는 것이 보여야 한다. 상태는 시뮬레이터에게 매번 묻는다.
setInterval(refresh, 1000);
</script>
</body>
</html>
