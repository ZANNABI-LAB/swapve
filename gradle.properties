# Maven Central 좌표 (공개 로드맵 6단계 · BACKLOG B07)
#
# 그룹 ID 는 `io.github.<GitHub 조직>` 이다 — 도메인 소유 증명 없이 조직 소유 증명만으로
# 네임스페이스를 받는다. 패키지명(`dev.swapve.*`)과 갈리는 것은 의도된 것이고 흔한 일이다
# (`org.jetbrains.kotlinx` 그룹의 패키지가 `kotlinx.*` 다). 하이픈은 패키지명에 못 쓴다.
group=io.github.zannabi-lab

# ⚠️ Central 은 **올린 버전을 지울 수 없다.** 첫 배포는 `0.0.1` 로 리허설하고,
# 문제가 없을 때 `0.1.0` 으로 올린다 (docs/PUBLISHING.md).
version=0.2.0

org.gradle.caching=true
org.gradle.parallel=true

# Dokka Gradle plugin V2. V1 은 Dokka 2.1.0 에서 제거된다 — 배포 직전에 곧 사라질 설정을
# 박아 두지 않는다. 플래그 이름에 experimental 이 있지만 2.0.0 의 권장 경로다.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
