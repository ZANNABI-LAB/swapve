# ★ 이 파일의 게이트 목록이 이 프로젝트의 **완료의 정의**다.
# 로컬에서 무엇을 돌렸든 판정은 여기서 난다. 게이트를 늘리거나 고칠 때
# README 의 "개발 방식" 절도 같이 본다 — 두 곳이 갈리면 문서가 거짓이 된다.
#
#   L1 단위        :csms:cleanTest build     — 단위 시험 + 모듈 경계 검증 5종 + Java 호환 시험
#   L2 표준 적합성  conformanceTest           — TC_S_102/103_CSMS + 실패 F1~F6 (인증 BASIC)
#   L3 부하 + 감사  auditTest                 — 스테이션 20대 동시 → 불변식 감사 (S4, 인증 BASIC)
#   L4 복구·보존   EventLogRecovery/Retention/SwapMetrics
#   L5 스테이션 인증 BasicAuthTest             — 보안 프로파일 1
#   L6 API 인증     ApiAuthTest/SimConsoleControlTest — REST · 콘솔 인증
#
# ⚠️ 모든 게이트에 `--no-build-cache` 를 붙이는 이유: `:csms:cleanTest` 만으로는
#    부족하다. 출력을 지워도 **빌드 캐시가 복원한다** (`gradle.properties` 의
#    `org.gradle.caching=true`). 2026-08-21 실측 — `./gradlew cleanTest build` 가
#    `:csms:test FROM-CACHE` 로 3.1초에 끝났고, `--no-build-cache` 를 붙이니 32초 동안
#    시험이 실제로 돌았다. **시험을 돌리지 않은 게이트는 초록이어도 아무것도 확인하지
#    않은 것이다.** 실제로 이 눈먼 지점에 결함이 숨은 적이 있다.
#    CI 는 새 체크아웃이지만 setup-gradle 이 캐시를 복원하므로 여기서도 똑같이 일어난다.
#
# 게이트를 한 줄로 합치지 않는다. 합치면 "단위는 통과했는데 적합성이 깨졌다"가 로그
# 어딘가에 묻히고, 게이트를 나눠 둔 이유가 사라진다.
#
# 배포는 이 워크플로가 하지 않는다 — 태그를 밀면 도는 release.yml 이 따로 있다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 17 — 빌드의 jvmToolchain(17) 과 같은 값이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 캐시는 이 액션이 알아서 한다. 손으로 키를 짜면 그때부터 관리 대상이 된다.
      - uses: gradle/actions/setup-gradle@v4

      - name: L1 단위 게이트 + 모듈 경계 검증
        run: ./gradlew --no-build-cache :csms:cleanTest build

      - name: L2 표준 적합성 게이트 (TC_S_102/103_CSMS · F1~F6)
        run: ./gradlew --no-build-cache conformanceTest

      - name: L3 부하 + 불변식 감사 게이트 (스테이션 20대 동시)
        run: ./gradlew --no-build-cache auditTest

      - name: L4 복구 · 보존 게이트
        run: >-
          ./gradlew --no-build-cache :csms:cleanTest :csms:test
          --tests '*EventLogRecoveryTest*'
          --tests '*SwapMetricsApiTest*'
          --tests '*RetentionTest*'

      - name: L5 스테이션 인증 게이트 (보안 프로파일 1)
        run: ./gradlew --no-build-cache :csms:cleanTest :csms:test --tests '*BasicAuthTest*'

      # ⚠️ 이 게이트가 한동안 여기에만 없었다. 로컬에서는 돌고 CI 에서는 안 도는
      #    상태였고, 그동안 REST · 콘솔 인증은 푸시마다 확인되지 않았다.
      - name: L6 REST · 콘솔 인증 게이트
        run: >-
          ./gradlew --no-build-cache :csms:cleanTest :csms:test
          --tests '*ApiAuthTest*'
          --tests '*SimConsoleControlTest*'

      # 실패했을 때 무엇이 깨졌는지 보려면 리포트가 있어야 한다.
      - name: 시험 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
