# `.zannabi.json` 의 게이트를 그대로 돈다.
# 그 파일이 이 프로젝트의 **완료의 정의**이므로, 여기 목록이 그것과 갈리면 CI 가
# 초록인데 완료 기준은 확인되지 않은 상태가 된다. 게이트를 늘릴 때 두 곳을 같이 고친다.
#
#   L1 단위        :csms:cleanTest build     — 단위 시험 + 모듈 경계 검증 5종 + Java 호환 시험
#   L2 표준 적합성  conformanceTest           — TC_S_102/103_CSMS + 실패 F1~F6 (인증 BASIC)
#   L3 부하 + 감사  auditTest                 — 스테이션 20대 동시 → 불변식 감사 (S4, 인증 BASIC)
#   L4 복구·보존   EventLogRecovery/Retention/SwapMetrics
#   L5 스테이션 인증 BasicAuthTest             — 보안 프로파일 1
#   L6 API 인증     ApiAuthTest/SimConsoleControlTest — REST · 콘솔 인증
#
# ⚠️ L1 에 `:csms:cleanTest` 를 앞세우는 이유: 그냥 `build` 는 캐시가 살아 있으면
#    `test` 가 UP-TO-DATE 로 스킵된다. CI 는 매번 새 체크아웃이지만 Gradle 캐시는
#    액션이 복원하므로 여기서도 실제로 일어날 수 있다. 실제로 이 눈먼 지점에 결함이
#    숨은 적이 있다.
#
# 게이트를 한 줄로 합치지 않는다. 합치면 "단위는 통과했는데 적합성이 깨졌다"가 로그
# 어딘가에 묻히고, 게이트를 나눠 둔 이유가 사라진다.
#
# 배포는 이 워크플로가 하지 않는다 — 태그를 밀면 도는 release.yml 이 따로 있다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 17 — 빌드의 jvmToolchain(17) 과 같은 값이다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 캐시는 이 액션이 알아서 한다. 손으로 키를 짜면 그때부터 관리 대상이 된다.
      - uses: gradle/actions/setup-gradle@v4

      - name: L1 단위 게이트 + 모듈 경계 검증
        run: ./gradlew :csms:cleanTest build

      - name: L2 표준 적합성 게이트 (TC_S_102/103_CSMS · F1~F6)
        run: ./gradlew conformanceTest

      - name: L3 부하 + 불변식 감사 게이트 (스테이션 20대 동시)
        run: ./gradlew auditTest

      - name: L4 복구 · 보존 게이트
        run: >-
          ./gradlew :csms:cleanTest :csms:test
          --tests '*EventLogRecoveryTest*'
          --tests '*SwapMetricsApiTest*'
          --tests '*RetentionTest*'

      - name: L5 스테이션 인증 게이트 (보안 프로파일 1)
        run: ./gradlew :csms:cleanTest :csms:test --tests '*BasicAuthTest*'

      # ⚠️ 이 게이트는 `.zannabi.json` 에는 있었는데 여기에 없었다. 파일 머리의 규칙이
      #    "두 곳을 같이 고친다" 인데 실제로 갈렸던 자리다.
      - name: L6 REST · 콘솔 인증 게이트
        run: >-
          ./gradlew :csms:cleanTest :csms:test
          --tests '*ApiAuthTest*'
          --tests '*SimConsoleControlTest*'

      # 실패했을 때 무엇이 깨졌는지 보려면 리포트가 있어야 한다.
      - name: 시험 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
