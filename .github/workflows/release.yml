# 태그를 밀면 Maven Central 에 **업로드**한다. 릴리스 버튼은 여전히 사람이 누른다.
#
# 왜 자동 릴리스(`publishAndReleaseToMavenCentral`)를 쓰지 않는가:
# Central 은 올린 버전을 지울 수 없다. 파일 목록과 POM 을 사람이 한 번 보고 누르는 절차가
# 남아 있는 편이 낫고, 그 판단은 docs/PUBLISHING.md 와 같다.
#
# 이 워크플로가 있는 이유는 편의가 아니라 **기계 종속을 없애기 위해서**다. 서명 키와 Portal
# 토큰이 개발자의 노트북에만 있으면, 그 기계가 사라질 때 배포도 사라진다.
#
# 필요한 저장소 secret 다섯 (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME          Portal 토큰의 username (계정 비밀번호가 아니다)
#   MAVEN_CENTRAL_PASSWORD          Portal 토큰의 password
#   SIGNING_IN_MEMORY_KEY           ASCII-armor 전문. **진짜 줄바꿈이 든 여러 줄 그대로**
#   SIGNING_IN_MEMORY_KEY_ID        짧은 키 ID
#   SIGNING_IN_MEMORY_KEY_PASSWORD  키 암호
#
# ⚠️ SIGNING_IN_MEMORY_KEY 에서 헤더/푸터를 떼면 "Could not read PGP secret key" 로 죽는다.
#
# ⚠️ 그리고 여기서는 `\n` 이스케이프를 쓰지 않는다. 로컬 `~/.gradle/gradle.properties` 는
#    .properties 형식이라 값 안에 진짜 줄바꿈을 못 넣어 `\n` 을 쓰지만, secret 은
#    ORG_GRADLE_PROJECT_* 환경변수로 들어가고 환경변수는 이스케이프를 풀지 않는다.
#    같은 값을 그대로 복사하면 리터럴 `\n` 이 남아 PGP 파싱이 깨진다.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_publish:
        description: '라이브러리 소스가 안 바뀌었어도 Central 에 업로드한다'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 직전 태그와 비교해야 하므로 얕은 체크아웃으로는 안 된다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # ★ 태그와 gradle.properties 의 version 이 갈리면 여기서 멈춘다.
      #   갈린 채로 올리면 `v0.2.0` 태그가 0.1.0 을 배포하고, Central 은 되돌릴 수 없다.
      - name: 태그와 version 이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "태그=$tag  gradle.properties=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::태그 v$tag 와 gradle.properties 의 $version 이 다르다"
            exit 1
          fi

      # 배포 전에 게이트를 다시 돈다. CI 가 초록이었다는 것과 이 커밋이 초록인 것은 다르다.
      - name: 게이트 전량
        run: |
          ./gradlew :csms:cleanTest build
          ./gradlew conformanceTest
          ./gradlew auditTest

      # ★ 태그 하나가 두 가지를 낸다 — Central 의 라이브러리와 Release 의 도구 zip.
      #   그런데 그 둘은 같은 속도로 변하지 않는다. 화면·CLI·문서만 좋아진 구간이 실제로
      #   있었고(v0.2.0 이후 47파일 2,251줄이 바뀌는 동안 배포 라이브러리는 0줄이었다),
      #   그때 도구 zip 을 내려면 **올릴 것이 없는 라이브러리의 버전을 올려야** 했다.
      #   Central 은 같은 버전을 다시 받지 않으므로 다른 길이 없었다.
      #
      #   그래서 판단을 사람의 기억이 아니라 diff 에 맡긴다. 배포되는 두 모듈의 main 소스가
      #   직전 태그 이후 한 줄도 안 바뀌었으면 업로드를 건너뛰고 zip 만 낸다.
      #   ⚠️ 건너뛰는 쪽이 안전한 방향이다 — 잘못 올린 버전은 지울 수 없지만, 안 올린
      #   버전은 다음 태그에서 올리면 된다. 그래도 강제하고 싶으면 workflow_dispatch 의
      #   force_publish 를 쓴다.
      - name: 배포 라이브러리가 바뀌었는지 본다
        id: libs
        run: |
          # ⚠️ "가장 높은 버전의 태그" 가 아니라 **이 커밋의 조상 중 가장 가까운 태그**를
          #    기준으로 삼는다. 버전 정렬은 `v0.3.0-rc1` 을 `v0.3.0` 보다 위에 놓으므로,
          #    정렬로 고르면 첫 정식 릴리스가 RC 와 비교돼 diff 가 비고 조용히 건너뛴다.
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -z "$previous" ]; then
            echo "직전 태그가 없다 — 업로드한다"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ⚠️ jar 에 실리는 것 전부를 본다. 소스만 보면 스키마 개정이나 라이선스·POM 변경이
          #    "안 바뀌었다" 로 읽힌다 — `syncOcppSchemas` 가 루트 schemas/ 의 181개를
          #    ocpp-core 의 리소스로 넣고, LICENSE·NOTICE 는 META-INF 에 찍힌다.
          paths="ocpp-core/src/main swap-domain/src/main schemas LICENSE NOTICE"
          paths="$paths gradle.properties build.gradle.kts ocpp-core/build.gradle.kts"
          paths="$paths swap-domain/build.gradle.kts gradle/libs.versions.toml"

          changed=$(git diff --name-only "$previous..HEAD" -- $paths | wc -l)
          echo "$previous..HEAD 에서 배포물에 실리는 변경 파일 수: $changed"
          git diff --stat "$previous..HEAD" -- $paths || true

          if [ "$changed" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 업로드만 한다. Portal 에서 사람이 Publish 를 누르기 전에는 게시되지 않는다.
      - name: Maven Central 업로드
        if: steps.libs.outputs.changed == 'true' || inputs.force_publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      # ★ Central 에 올라가는 것은 라이브러리 둘뿐이다. 도구를 쓰려는 사람에게는
      #   좌표가 아니라 받아서 바로 돌릴 수 있는 한 벌이 필요하다.
      #   스모크는 사람이 한 번 돌려 확인한다 — 풀어서 두 CLI 의 --help 가 뜨고,
      #   csms.jar 에 시뮬레이터를 붙여 교환 1건이 완주하는지까지다.
      - name: 배포물 한 벌 만들기
        run: ./gradlew releaseBundle

      - name: GitHub Release 에 붙인다
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/swapve-*.zip
          fail_on_unmatched_files: true

      - name: 라이브러리를 건너뛰었으면 그 사실을 남긴다
        if: steps.libs.outputs.changed != 'true' && !inputs.force_publish
        run: |
          {
            echo "### 도구만 배포했다"
            echo ""
            echo "직전 태그 이후 \`ocpp-core\`·\`swap-domain\` 의 main 소스가 한 줄도"
            echo "바뀌지 않아 **Maven Central 업로드를 건너뛰었다.** Release 에 붙은"
            echo "zip 은 정상이다. 올려야 했다면 workflow_dispatch 의"
            echo "\`force_publish\` 로 다시 돌린다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 다음에 할 일을 요약에 남긴다
        if: steps.libs.outputs.changed == 'true' || inputs.force_publish
        run: |
          {
            echo "### 업로드 완료 — 아직 게시되지 않았다"
            echo ""
            echo "<https://central.sonatype.com> → Publish → Deployments 에서"
            echo "상태가 \`VALIDATED\` 인지 확인하고 **Publish** 를 누른다."
            echo ""
            echo "누른 뒤 반영 확인:"
            echo '```'
            echo "curl -s -o /dev/null -w '%{http_code}\\n' \\"
            echo "  https://repo1.maven.org/maven2/io/github/zannabi-lab/ocpp-core/${GITHUB_REF_NAME#v}/ocpp-core-${GITHUB_REF_NAME#v}.pom"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
